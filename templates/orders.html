{% extends 'base.html' %}{% block title %}Orders{% endblock %}{% block content %}<div class="toolbar"><form><input name="q" value="{{q}}" placeholder="Search order, customer or channel…"><select name="priority"><option>All</option><option {{'selected' if priority=='Priority'}}>Priority</option><option {{'selected' if priority=='Normal'}}>Normal</option></select><select name="status"><option>All</option>{% for s in ['Processing','Picking','Packing','Staged','Shipped','Blocked'] %}<option {{'selected' if status==s}}>{{s}}</option>{% endfor %}</select><button>Filter</button></form></div><div class="panel table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Channel</th><th>Priority</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>{% for o in orders %}<tr><td><a class="order-link" href="/orders/{{o.id}}">#{{o.id}}</a></td><td>{{o.customer}}</td><td>{{o.channel}}</td><td><span class="tag {{o.priority|lower}}">{{o.priority}}</span></td><td>{{o.deadline[11:]}}</td><td><span class="status {{o.status|lower}}">{{o.status}}</span></td><td><a class="chev" href="/orders/{{o.id}}">›</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
